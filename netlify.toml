# Netlify — site public cinemaX-web
# Le front appelle /api (même origine). Les redirects ci-dessous proxyent vers Render,
# donc pas besoin de VITE_API_URL au build, ni de CORS pour le catalogue.
# Stripe : Site configuration → Environment variables → VITE_STRIPE_PUBLISHABLE_KEY

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/api/*"
  to = "https://cinemax-api-xc50.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/health"
  to = "https://cinemax-api-xc50.onrender.com/health"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
